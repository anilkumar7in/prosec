services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    image: prosec-saas-control-plane
    ports:
      - "8080:8080"
    # Pass-through form (no "="): each variable reaches the container only when
    # it is set on the host. Assigning an empty default instead would shadow the
    # application.yml fallbacks with empty strings and break the datasource.
    environment:
      - SPRING_PROFILES_ACTIVE
      - PROSEC_ADMIN_API_KEY
      - DB_URL
      - DB_USERNAME
      - DB_PASSWORD
    volumes:
      - control-plane-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # Optional Postgres backend. Start with:
  #   SPRING_PROFILES_ACTIVE=postgres docker compose --profile postgres up --build
  # (the postgres profile defaults to jdbc:postgresql://postgres:5432/prosec)
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: prosec
      POSTGRES_USER: prosec
      POSTGRES_PASSWORD: prosec
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prosec -d prosec"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  control-plane-data:
  postgres-data:
